<mat-toolbar class="thin main-toolbar">
    <button class="add-member" mat-flat-button color="accent" matPrefix aria-label="Add Member" (click)="addMember()">
        <mat-icon>add_circle</mat-icon>Add Member
    </button>
    <span class="example-spacer"></span>
    <mat-form-field  id="searchInput">
        <input matInput type="search" [formControl]="searchBar">
        <button matSuffix mat-icon-button aria-label="Search">
          <mat-icon>search</mat-icon>
        </button>
      </mat-form-field>
    <button mat-icon-button aria-label="Print" (click)="print()" color="accent">
        <mat-icon>print</mat-icon>
    </button>
</mat-toolbar>
<ng-container>
    <table mat-table matSort [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;">
        <!-- Checkbox Column -->
        <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef>
                <mat-checkbox (change)="$event ? masterToggle() : null"
                    [checked]="selection.hasValue() && isAllSelected()"
                    [indeterminate]="selection.hasValue() && !isAllSelected()">
                </mat-checkbox>
            </th>
            <td mat-cell *matCellDef="let row">
                <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
                    [checked]="selection.isSelected(row)">
                </mat-checkbox>
            </td>
        </ng-container>

        <ng-container matColumnDef="rownum">
            <th mat-header-cell *matHeaderCellDef ></th>
            <td mat-cell *matCellDef="let i = index">{{i + 1}}</td>
        </ng-container>

        <ng-container matColumnDef="Name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
            <td mat-cell *matCellDef="let member"> {{member.Name}} </td>
        </ng-container>

        <ng-container matColumnDef="IdentificationID">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Member ID </th>
            <td mat-cell *matCellDef="let member"> {{member.IdentificationID}} </td>
        </ng-container>

        <ng-container matColumnDef="City">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Country </th>
            <td mat-cell *matCellDef="let member"> {{member.Country}} </td>
        </ng-container>

        <ng-container matColumnDef="State">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> City/State </th>
            <td mat-cell *matCellDef="let member"> {{member.City}} </td>
        </ng-container>

        <ng-container matColumnDef="Dojo">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Dojo </th>
            <td mat-cell *matCellDef="let member"> {{member.Dojo}} </td>
        </ng-container>

        <ng-container matColumnDef="LastCertRank">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Rank </th>
            <td mat-cell *matCellDef="let member"> {{member.RankString}} </td>
        </ng-container>

        <ng-container matColumnDef="LastCertDate">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
            <td mat-cell *matCellDef="let member"> {{member.LastCertDateString}} </td>
        </ng-container>

        <ng-container matColumnDef="Action">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let member">
                <button mat-icon-button (click)="editMember(member)">
                    <mat-icon>grading</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

</ng-container>
